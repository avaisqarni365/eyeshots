name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck (web, gateway, tests)
        run: npm run typecheck
      - name: Lint (warning count may not grow)
        run: npm run lint
      - name: Unit tests with coverage
        run: npx vitest run --project web --project gateway --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  integration:
    name: Gateway integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eyeshots_test
          POSTGRES_USER: eyeshots
          POSTGRES_PASSWORD: eyeshots
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eyeshots -d eyeshots_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://eyeshots:eyeshots@localhost:5432/eyeshots_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Integration tests (mock Stirling engine)
        run: npm run test:integration

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Gateway image build + vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t eyeshots/gateway:${{ github.sha }} services/api-gateway
      - name: Smoke-test image (migrations shipped, both entrypoints present)
        run: docker run --rm --entrypoint sh eyeshots/gateway:${{ github.sha }} -c 'test -f migrations/001_accounts_billing.sql && test -f dist/index.js && test -f dist/worker.js && [ "$(whoami)" = node ]'
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eyeshots/gateway:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
