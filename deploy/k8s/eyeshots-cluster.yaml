apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyeshots-gateway-deployment
  labels:
    app: eyeshots-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eyeshots-gateway
  template:
    metadata:
      labels:
        app: eyeshots-gateway
    spec:
      containers:
      - name: gateway
        image: eyeshots/gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://eyeshots-redis-service:6379"
        - name: STIRLING_ENGINE_URL
          value: "http://eyeshots-stirling-service:8080"
        # Pods on different nodes can't share a tmpfs volume, so queued job
        # files go to S3-compatible storage (swept within the 2-hour policy).
        - name: JOB_STORE
          value: "s3"
        envFrom:
        - secretRef:
            name: eyeshots-gateway-secrets   # INTERNAL_STIRLING_API_KEY, S3_BUCKET, S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ALLOWED_ORIGINS, ADMIN_API_TOKEN
        readinessProbe:
          httpGet: { path: /ready, port: 4000 }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 4000 }
          periodSeconds: 20
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eyeshots-gateway-service
spec:
  selector:
    app: eyeshots-gateway
  ports:
  - port: 4000
    targetPort: 4000
---
# Queue workers: scale on queue depth (e.g. KEDA redis-lists scaler on
# bull:eyeshots-pdf-jobs:wait) rather than CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyeshots-worker-deployment
  labels:
    app: eyeshots-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: eyeshots-worker
  template:
    metadata:
      labels:
        app: eyeshots-worker
    spec:
      # Let in-flight conversions finish before the pod is killed.
      terminationGracePeriodSeconds: 200
      containers:
      - name: worker
        image: eyeshots/gateway:latest
        command: ["node", "dist/worker.js"]
        env:
        - name: WORKER_CONCURRENCY
          value: "2"
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://eyeshots-redis-service:6379"
        - name: STIRLING_ENGINE_URL
          value: "http://eyeshots-stirling-service:8080"
        # Pods on different nodes can't share a tmpfs volume, so queued job
        # files go to S3-compatible storage (swept within the 2-hour policy).
        - name: JOB_STORE
          value: "s3"
        envFrom:
        - secretRef:
            name: eyeshots-gateway-secrets   # INTERNAL_STIRLING_API_KEY, S3_BUCKET, S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ALLOWED_ORIGINS, ADMIN_API_TOKEN
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyeshots-web-deployment
  labels:
    app: eyeshots-web
spec:
  replicas: 4
  selector:
    matchLabels:
      app: eyeshots-web
  template:
    metadata:
      labels:
        app: eyeshots-web
    spec:
      containers:
      - name: web
        image: eyeshots/web:latest
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eyeshots-web-service
spec:
  selector:
    app: eyeshots-web
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
