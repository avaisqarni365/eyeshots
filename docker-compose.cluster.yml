version: '3.8'

services:
  # 1. Edge Load Balancer & SSL Termination
  eyeshots-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - eyeshots-web
      - eyeshots-api-gateway
    restart: always

  # 2. Frontend User Application (Scalable Next.js Cluster)
  eyeshots-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=${PUBLIC_GATEWAY_URL:?set PUBLIC_GATEWAY_URL to the public https URL of the gateway}
      - NODE_ENV=production
    deploy:
      replicas: 3
    restart: always

  # 3. Decoupled B2B API Gateway (Accounting & Legal Integrations)
  eyeshots-api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - STIRLING_ENGINE_URL=http://eyeshots-stirling-pool:8080
      - REDIS_URL=redis://eyeshots-redis:6379
      - INTERNAL_STIRLING_API_KEY=${INTERNAL_STIRLING_API_KEY:?required}
      - NODE_ENV=production
      - JOB_STORE=fs
      - JOB_STORE_DIR=/jobs
    volumes:
      - job_blobs:/jobs
    deploy:
      replicas: 2
    depends_on:
      - eyeshots-redis
      - eyeshots-stirling-pool
    restart: always

  # 4. Asynchronous Task Worker (BullMQ Background Heavy Processing)
  eyeshots-worker:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://eyeshots-redis:6379
      - STIRLING_ENGINE_URL=http://eyeshots-stirling-pool:8080
      - INTERNAL_STIRLING_API_KEY=${INTERNAL_STIRLING_API_KEY:?required}
      # Single Docker host: gateway and workers share a RAM-backed volume.
      # For multi-host deployments switch to JOB_STORE=s3 (see .env.example).
      - JOB_STORE=fs
      - JOB_STORE_DIR=/jobs
    volumes:
      - job_blobs:/jobs
    deploy:
      replicas: 4
    depends_on:
      - eyeshots-redis
    restart: always

  # 5. Headless PDF Processing Engine Microservice Pool
  eyeshots-stirling-pool:
    image: frooodle/s-pdf:latest
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - SYSTEM_DEFAULTLOCALE=en-US
    deploy:
      replicas: 2
    restart: always

  # 6. Cluster Cache, Queues & Ephemeral Rate Limiting (Redis)
  eyeshots-redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; no persistence keeps job metadata ephemeral.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1024mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_cluster_data:/data
    restart: always

  # 7. Ephemeral Storage (MinIO S3-Compatible Object Store with 2-Hour TTL)
  eyeshots-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_cluster_blobs:/data
    restart: always

volumes:
  redis_cluster_data:
  minio_cluster_blobs:
  # Shared RAM-backed store for queued job files (zero retention across restarts).
  job_blobs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=8g,uid=1000,gid=1000,mode=0700"
